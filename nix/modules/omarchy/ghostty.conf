# Omarchy-only Ghostty overrides, loaded after the shared ~/dotfiles/ghostty/config
# (wired up in ghostty.nix). Mirrors omarchy's stock ghostty config so the
# terminal matches the rest of the desktop. An empty value resets a key to
# Ghostty's default.

# Colors: follow omarchy's current theme instead of the macs' Kanagawa.
# `omarchy theme set` rewrites this file and reloads running terminals.
theme =
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"

# Opacity is left to Hyprland's window rules, like every other omarchy app.
background-opacity = 1
background-blur-radius = 0

# Font: omarchy's size and weight rather than the macs' heavy 15pt.
font-size = 9
font-style = Regular
font-style-bold = default
font-style-italic = default
font-style-bold-italic = default
font-variation =
font-variation-bold =
font-variation-italic =
font-variation-bold-italic =
adjust-cell-height =

# Window
window-theme = ghostty
window-padding-x = 14
window-padding-y = 14
resize-overlay = never
gtk-toolbar-style = flat

# SSH sessions get Ghostty's terminfo.
shell-integration-features = no-cursor,ssh-env

# Keyboard bindings. Shift+Enter keeps the shared config's mapping.
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
keybind = alt+shift+enter=csi:13;4u
keybind = super+control+shift+alt+arrow_down=resize_split:down,100
keybind = super+control+shift+alt+arrow_up=resize_split:up,100
keybind = super+control+shift+alt+arrow_left=resize_split:left,100
keybind = super+control+shift+alt+arrow_right=resize_split:right,100

mouse-scroll-multiplier = 0.95

# Fix general slowness on hyprland (https://github.com/ghostty-org/ghostty/discussions/3224)
async-backend = epoll
