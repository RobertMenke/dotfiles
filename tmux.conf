# ─────────────────────────────────────────────────────────────────────────────
# Terminal capabilities
# ─────────────────────────────────────────────────────────────────────────────
# Ghostty reports itself as xterm-256color (see ghostty/config) so that ssh to
# hosts lacking the xterm-ghostty terminfo still works. Neither xterm-256color
# nor tmux-256color declares RGB, so without the override below tmux quantizes
# to 256 colours and kanagawa-dragon's closely-spaced greys collapse into each
# other. Verify with `tmux info | grep -E 'RGB|Smulx|Sync'` — all three should
# be present, not "[missing]".
#
#   RGB         24-bit colour
#   usstyle     coloured undercurl (LSP diagnostics render as squiggles)
#   sync        synchronized output, removes redraw tearing in nvim
#   hyperlinks  OSC 8
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle:sync:hyperlinks"

# Let programs inside a pane speak to Ghostty directly (kitty graphics, OSC).
set -g allow-passthrough on

# ─────────────────────────────────────────────────────────────────────────────
# Behaviour
#
# These were previously supplied by tmux-plugins/tmux-sensible via TPM. TPM is
# gone (see NOTE at the bottom of this file); the handful of settings that
# actually mattered are inlined here so this file is self-contained.
# ─────────────────────────────────────────────────────────────────────────────
set -s escape-time 0            # no lag on <Esc> in nvim
set -g focus-events on          # drives nvim's FocusGained / :checktime
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g repeat-time 1000
set -g status-keys emacs        # emacs keys at tmux's own command prompt
setw -g aggressive-resize on

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─────────────────────────────────────────────────────────────────────────────
# Window naming
#
# tmux's stock automatic-rename-format is just #{pane_current_command}, which
# labels every idle window with the name of the shell -- "fish fish fish". Show
# the working directory instead whenever the foreground process *is* the shell,
# and the command name only when something is actually running.
#
#   idle in ~/dotfiles      -> dotfiles
#   idle in $HOME           -> ~
#   running nvim            -> nvim
#   running top             -> top
#
# The regexp is anchored so `ssh` is not mistaken for a shell by a *sh glob.
# The #{pane_current_path} guard matters because tmux cannot always read a
# process's cwd (`top` is one such case) and returns empty -- without it the
# window would end up nameless. $HOME is expanded by tmux at parse time, which
# keeps this correct on the work host, where the username differs.
#
# Windows named explicitly -- as every tmuxinator project here does -- have
# automatic-rename switched off by tmux, so none of this overrides them.
#
# For "directory plus command" instead (dotfiles/nvim), swap the format for:
#   "#{?#{pane_current_path},$CWD_NAME#{?#{m/r:$SHELLS,#{pane_current_command}},,/#{pane_current_command}},#{pane_current_command}}"
%hidden SHELLS="^(fish|zsh|bash|sh|dash)$"
%hidden CWD_NAME="#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"
set -g automatic-rename on
set -g automatic-rename-format "#{?#{&&:#{m/r:$SHELLS,#{pane_current_command}},#{pane_current_path}},$CWD_NAME,#{pane_current_command}}"
setw -g mode-keys vi
set -g set-clipboard on         # OSC 52, so yanks reach the clipboard over ssh

# fish is symlinked into ~/.local/bin by nix/modules/home/dotfiles.nix precisely
# so this line does not have to hard-code a username or a store path.
set -g default-shell $HOME/.local/bin/fish

# ─────────────────────────────────────────────────────────────────────────────
# Key bindings
# ─────────────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits and new windows inherit the current pane's directory. The default
# bindings are kept alongside the mnemonic ones so muscle memory still works.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Seamless pane/window traversal across the tmux↔nvim boundary. This is the
# vim-tmux-navigator protocol inlined — the tmux half needs no plugin, only the
# nvim half (nvim/lua/my/plugins/tmux-navigator.lua). Bare C-h/j/k/l moves
# between nvim splits and tmux panes interchangeably.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# C-l used to be clear-screen; keep it reachable behind the prefix.
bind C-l send-keys 'C-l'

# Prefix-based pane traversal, retained from the previous config and now
# repeatable (hold the direction key without re-pressing the prefix).
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize with the shifted equivalents.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# mode-keys vi only gives vi *motions* in copy mode; the selection verbs still
# have to be bound by hand.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Session switcher. `dev` starts three sessions at once (nix/modules/home/
# fish.nix), which is more than `prefix )` is pleasant for.
bind C-j display-popup -E -w 40% -h 30% \
  "tmux ls | cut -d: -f1 | fzf --reverse --prompt='session ' | xargs -I{} tmux switch-client -t {}"

# Throwaway shell in a popup, rooted at the current pane's directory.
bind C-g display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────────────────────
# Theme — kanagawa dragon
#
# Matches `theme = Kanagawa Dragon` in ghostty/config and `colorscheme
# kanagawa-dragon` in nvim/lua/my/colorschemes/kanagawa.lua. Hex values are
# lifted verbatim from rebelot/kanagawa.nvim, lua/kanagawa/colors.lua.
# ─────────────────────────────────────────────────────────────────────────────
%hidden BLACK3="#181616"
%hidden BLACK4="#282727"
%hidden BLACK5="#393836"
%hidden WHITE="#c5c9c5"
%hidden ASH="#737c73"
%hidden GRAY="#a6a69c"
%hidden YELLOW="#c4b28a"
%hidden RED="#c4746e"
%hidden BLUE="#8ba4b0"

# Status bar. bg=default is load-bearing: it is what lets ghostty's
# `background-opacity = 0.9` show through the bar.
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-style "fg=$ASH bg=default"

set -g status-left  "#[fg=$ASH] #S "
set -g status-left-length 30

# A prefix indicator — the one piece of state that is otherwise invisible.
set -g status-right "#[fg=$YELLOW]#{?client_prefix,● ,}#[fg=$ASH] "
set -g status-right-length 20

# Inactive windows are plain text; the active one gets a powerline bubble. The
# two glyphs are U+E0B6 and U+E0B4 (JetBrainsMono Nerd Font).
set -g window-status-format         "#I:#W"
set -g window-status-style          "fg=$ASH bg=default"
set -g window-status-current-format "#[fg=$BLACK5]#[bg=default]#[fg=$WHITE]#[bg=$BLACK5] #I:#W #[fg=$BLACK5]#[bg=default]"
set -g window-status-separator "  "
set -g window-status-activity-style none
set -g window-status-bell-style "fg=$RED"

# Everything below was previously inheriting tmux's raw defaults — bright ANSI
# yellow message bars, red/blue pane indicators — against a muted palette.
set -g message-style         "fg=$WHITE bg=$BLACK4"
set -g message-command-style "fg=$YELLOW bg=$BLACK4"

setw -g mode-style "fg=$BLACK3 bg=$YELLOW"

set -g pane-border-lines single
set -g pane-border-style        "fg=$BLACK5"
set -g pane-active-border-style "fg=$BLUE"

set -g display-panes-colour        "$ASH"
set -g display-panes-active-colour "$YELLOW"

set -g clock-mode-colour "$BLUE"
set -g clock-mode-style 24

set -g popup-border-lines rounded
set -g popup-style        "bg=default"
set -g popup-border-style "fg=$BLACK5"

# ─────────────────────────────────────────────────────────────────────────────
# NOTE on plugins
#
# This config deliberately uses no plugin manager. TPM was previously bootstrapped
# from a hand-cloned ~/.tmux/plugins checkout, which was the only part of these
# dotfiles not managed by nix — and it had drifted: four plugins on disk
# (nord-tmux, catppuccin/tmux, tmux-nerd-font-window-name, vim-tmux-navigator)
# that this file never referenced, last updated in 2022–2024. The only plugin
# actually loading was tmux-sensible, whose useful settings are inlined above,
# and vim-tmux-navigator, whose tmux half is inlined above as well.
#
# If a plugin is ever genuinely needed, add it via `programs.tmux.plugins` in
# home-manager rather than reintroducing an unmanaged clone. ~/.tmux/plugins can
# be deleted.
# ─────────────────────────────────────────────────────────────────────────────
